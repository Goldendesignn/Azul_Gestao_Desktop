[package]
name = "azul_gestao_desktop"
version = "0.1.0"
description = "Azul Gestao offline desktop application"
authors = ["Azul Gestao"]
edition = "2021"

[lib]
name = "azul_gestao_desktop_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "azul_gestao_desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
